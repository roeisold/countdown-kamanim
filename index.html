<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונה התקדמות קורס - הסוף!</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden; 
            transition: background-color 0.5s ease;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            transition: box-shadow 0.6s ease-out, border 0.6s ease-out; 
            border: 2px solid transparent; 
            z-index: 1;
        }

        .celebration-glow-50 {
            box-shadow: 0 0 60px rgba(52, 152, 219, 0.8), 0 0 100px rgba(52, 152, 219, 0.4);
            border: 3px solid #3498db;
        }

        .celebration-glow-final {
            box-shadow: 0 0 80px rgba(155, 89, 182, 0.8), 0 0 120px rgba(155, 89, 182, 0.4);
            border: 4px solid #9b59b6;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #2c3e50;
        }
        
        .percentage {
            font-size: 48px;
            font-weight: bold;
            color: #27ae60; 
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.1s linear, background-color 0.5s ease;
        }
        
        button.action-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .celebrate-50-btn, .celebrate-final-btn {
            display: none;
            color: white;
            border: none;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin: 20px 0;
            width: 100%;
            animation: pulse-btn 1s infinite alternate;
        }
        
        .celebrate-50-btn { background: linear-gradient(45deg, #e74c3c, #f1c40f); }
        .celebrate-final-btn { background: linear-gradient(45deg, #9b59b6, #8e44ad); box-shadow: 0 10px 25px rgba(155, 89, 182, 0.5); }

        @keyframes pulse-btn {
            0% { transform: scale(1); }
            100% { transform: scale(1.05); }
        }

        @keyframes rainbow-anim {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .rainbow-active .percentage, .rainbow-active h1, .rainbow-active .did-you-know {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% auto;
            color: transparent !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            animation: rainbow-anim 2s linear infinite !important;
        }

        .meme-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            text-align: center;
        }

        .meme-text-final {
            font-family: 'Impact', sans-serif;
            font-size: 3.5rem;
            color: white;
            -webkit-text-stroke: 2px black;
            text-shadow: 4px 4px 0 #000, 0 0 15px rgba(255,255,255,0.3);
            background-color: rgba(0, 0, 0, 0.6);
            padding: 30px;
            border-radius: 20px;
            line-height: 1.3;
            max-width: 90%;
            margin-bottom: 20px;
        }

        .close-meme-btn {
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
        }
    </style>
</head>
<body class="normal-mode">

    <audio id="halfwayAudio" src="halfway.mp3" preload="auto" loop></audio>
    <audio id="breakFreeAudio" src="break_free.mp3" preload="auto" loop></audio>

    <div id="memeOverlay" class="meme-overlay">
        <div style="position:relative; width:600px; max-width:90%;">
            <img src="wall.jpg" style="width:100%; border-radius:10px;" alt="Brick Wall">
            <div style="position:absolute; top:5%; left:50%; transform:translateX(-50%); font-family:Impact; font-size:4rem; color:white; -webkit-text-stroke:2px black; text-shadow:4px 4px 0 #000; width:95%; background-color: rgba(0,0,0,0.5); border-radius: 10px;">נגענו בקיר!</div>
        </div>
        <button onclick="closeOverlay('memeOverlay', 'halfwayAudio')" class="close-meme-btn">יאללה להמשיך</button>
    </div>

    <div id="finalOverlay" class="meme-overlay">
        <div class="meme-text-final">
            נודרררר סיימנווו<br>יששש היידה סוף סוף<br>ישששש נודרר יישששש<br>🔓🕊️
        </div>
        <button onclick="closeOverlay('finalOverlay', 'breakFreeAudio')" class="close-meme-btn" style="background-color: #9b59b6;">חזרה למונה</button>
    </div>

    <div class="container" id="mainContainer">
        <h1 id="mainTitle">התקדמות הקורס</h1>
        <div id="milestoneMsg" style="font-weight:bold; color:#d35400; margin-bottom:10px; display:none;"></div>
        
        <button id="celebrate50Btn" class="celebrate-50-btn">🚨 הגענו ל-50%! לחץ לפתיחה 🚨</button>
        <button id="celebrateFinalBtn" class="celebrate-final-btn">🔓 לחץ כאן ליציאה לחופשי! 🔓</button>

        <div class="percentage" id="percentageDisplay">0.0000%</div>
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button id="toggleModeBtn" class="action-btn">הצג ברוטו (כולל סופ"שים)</button>
        <div class="mode-label" id="modeLabel" style="margin-top:15px; font-size:14px; color:#7f8c8d; margin-bottom:25px;">מצב נוכחי: נטו</div>

        <div class="did-you-know" id="didYouKnow" style="margin-top:20px; padding:15px; background-color:#e8f4f8; border-right:4px solid #3498db; border-radius:5px; font-size:15px; text-align:right; display:flex; align-items:center;"></div>
    </div>

    <script>
        const startDate = new Date('2026-04-23T09:00:00').getTime();
        const endDate = new Date('2026-05-21T09:00:00').getTime();
        const ceremonyDate = new Date('2026-05-20T19:00:00').getTime(); // תאריך הטקס
        const totalCourseMs = endDate - startDate;

        const exclusions = [
            { start: new Date('2026-05-01T11:00:00').getTime(), end: new Date('2026-05-03T09:00:00').getTime() },
            { start: new Date('2026-05-08T11:00:00').getTime(), end: new Date('2026-05-10T09:00:00').getTime() }
        ];

        let isNetMode = true;

        function shootConfetti(colors = null) {
            const count = 200;
            const defaults = { origin: { y: 0.7 }, zIndex: 10000 };
            if (colors) defaults.colors = colors;
            confetti({ ...defaults, particleCount: count, spread: 70, startVelocity: 45 });
        }

        function closeOverlay(id, audioId) {
            document.getElementById(id).style.display = 'none';
            const audio = document.getElementById(audioId);
            audio.pause();
            audio.currentTime = 0;
        }

        // כפתור 50%
        document.getElementById('celebrate50Btn').addEventListener('click', () => {
            localStorage.setItem('celebrated50', 'true');
            document.getElementById('memeOverlay').style.display = 'flex';
            document.getElementById('halfwayAudio').play().catch(e=>console.log('Audio error', e));
            shootConfetti();
            updateProgress();
        });

        // כפתור סיום (טקס)
        document.getElementById('celebrateFinalBtn').addEventListener('click', () => {
            localStorage.setItem('celebratedFinal', 'true');
            document.getElementById('finalOverlay').style.display = 'flex';
            document.getElementById('breakFreeAudio').play().catch(e=>console.log('Audio error', e));
            
            // מטח קונפטי אינסופי קטן
            const end = Date.now() + (15 * 1000);
            const interval = setInterval(function() {
                if (Date.now() > end) return clearInterval(interval);
                shootConfetti(['#9b59b6', '#ffffff', '#f1c40f', '#e74c3c']);
            }, 1000);
            
            updateProgress();
        });

        function updateProgress() {
            const now = new Date().getTime(); 

            let totalDuration = endDate - startDate;
            let elapsed = now - startDate;
            if (elapsed < 0) elapsed = 0;
            if (elapsed > totalDuration) elapsed = totalDuration;

            // נטו
            let excludedElapsed = 0;
            let excludedTotal = 0;
            exclusions.forEach(ex => {
                excludedTotal += (ex.end - ex.start);
                if (now > ex.start) {
                    excludedElapsed += (now > ex.end) ? (ex.end - ex.start) : (now - ex.start);
                }
            });

            const netPercentage = Math.max(0, Math.min(100, ((elapsed - excludedElapsed) / (totalDuration - excludedTotal)) * 100));
            const grossPercentage = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));
            const displayPercentage = isNetMode ? netPercentage : grossPercentage;

            // UI Elements
            const pDisplay = document.getElementById('percentageDisplay');
            const pBar = document.getElementById('progressBar');
            const container = document.getElementById('mainContainer');
            const finalBtn = document.getElementById('celebrateFinalBtn');
            const halfwayBtn = document.getElementById('celebrate50Btn');

            pDisplay.innerText = displayPercentage.toFixed(4) + '%';
            pBar.style.width = displayPercentage + '%';

            // לוגיקת סיום (החל מ-19:00 של ה-20.5)
            if (now >= ceremonyDate) {
                const hasCelebratedFinal = localStorage.getItem('celebratedFinal');
                if (!hasCelebratedFinal) {
                    hideNormalUI();
                    finalBtn.style.display = 'block';
                    finalBtn.innerText = '🔓 לחץ כאן ליציאה לחופשי! 🔓';
                    container.classList.add('celebration-glow-final');
                } else {
                    showNormalUI();
                    finalBtn.style.display = 'block';
                    finalBtn.innerText = '🎁 הפעל שוב חגיגת חופש 🎁';
                    document.body.classList.add('rainbow-active');
                    container.classList.add('celebration-glow-final');
                    pBar.style.backgroundColor = '#9b59b6';
                }
                halfwayBtn.style.display = 'none';
            } 
            // לוגיקת 50%
            else if (displayPercentage >= 50 && displayPercentage < 55) {
                const hasCelebrated50 = localStorage.getItem('celebrated50');
                if (!hasCelebrated50) {
                    hideNormalUI();
                    halfwayBtn.style.display = 'block';
                    halfwayBtn.innerText = '🚨 הגענו ל-50%! לחץ לפתיחה 🚨';
                } else {
                    showNormalUI();
                    halfwayBtn.style.display = 'block';
                    halfwayBtn.innerText = '🎁 הפעל שוב חגיגת קיר 🎁';
                    document.body.classList.add('rainbow-active');
                    container.classList.add('celebration-glow-50');
                    pBar.style.backgroundColor = '#3498db';
                }
                finalBtn.style.display = 'none';
            } 
            // רגיל
            else {
                showNormalUI();
                container.className = 'container';
                document.body.classList.remove('rainbow-active');
                pBar.style.backgroundColor = '#27ae60';
                halfwayBtn.style.display = 'none';
                finalBtn.style.display = 'none';
            }
        }

        function hideNormalUI() {
            document.getElementById('percentageDisplay').style.display = 'none';
            document.getElementById('progressBarContainer').style.display = 'none';
            document.getElementById('toggleModeBtn').style.display = 'none';
            document.getElementById('modeLabel').style.display = 'none';
            document.getElementById('didYouKnow').style.display = 'none';
        }

        function showNormalUI() {
            document.getElementById('percentageDisplay').style.display = 'block';
            document.getElementById('progressBarContainer').style.display = 'block';
            document.getElementById('toggleModeBtn').style.display = 'inline-block';
            document.getElementById('modeLabel').style.display = 'block';
            document.getElementById('didYouKnow').style.display = 'flex';
        }

        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isNetMode = !isNetMode;
            document.getElementById('toggleModeBtn').innerText = isNetMode ? 'הצג ברוטו (כולל סופ"שים)' : 'הצג נטו';
            updateProgress();
        });

        function calcPercentFromTotal(minutes) {
            return ((minutes * 60 * 1000 / totalCourseMs) * 100).toFixed(4) + '%';
        }

        function getRandomFact() {
            const facts = [
                `הידעת? הליכה לאולם הנגב לוקחת כ-${calcPercentFromTotal(3)} מהקורס.`,
                `הידעת? הנחת תפילין לוקחת כ-${calcPercentFromTotal(5)} מהזמן הכולל.`,
                `הידעת? יום ג' רפואי אחד שווה ל-${calcPercentFromTotal(1440)} מהקורס.`,
                `הידעת? לקח לי 1.5% מהקורס להכין את האתר הזה!`,
                `הידעת? גזירת זמנים של 10 דקות לוקחת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? שינה של 7 שעות לוקחת ${calcPercentFromTotal(420)} מכל הקורס.`,
                `הידעת? גלילה ב-Reels של 20 דקות שורפת ${calcPercentFromTotal(20)} מהקורס.`
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        setInterval(updateProgress, 50);
        setInterval(() => {
            const dyk = document.getElementById('didYouKnow');
            if(dyk.style.display !== 'none') {
                dyk.style.opacity = 0;
                setTimeout(() => { dyk.innerText = getRandomFact(); dyk.style.opacity = 1; }, 500);
            }
        }, 12000);
        
        updateProgress();
        document.getElementById('didYouKnow').innerText = getRandomFact();
    </script>
</body>
</html>

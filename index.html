<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונה התקדמות קורס</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden; 
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            transition: box-shadow 0.5s ease, border 0.5s ease;
        }
        .celebration-glow {
            box-shadow: 0 0 30px rgba(241, 196, 15, 0.5);
            border: 2px solid #f1c40f;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #2c3e50;
        }
        .milestone-msg {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 10px;
            display: none; 
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-3px);}
        }
        .percentage {
            font-size: 48px;
            font-weight: bold;
            color: #27ae60;
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.1s linear, background-color 0.5s ease;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        .mode-label {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .did-you-know {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 4px solid #3498db;
            border-radius: 5px;
            font-size: 15px;
            color: #2c3e50;
            text-align: right;
            min-height: 45px;
            display: flex;
            align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>התקדמות הקורס</h1>
        <div class="milestone-msg" id="milestoneMsg">🎉 25% מהדרך מאחורינו! 🎉</div>
        <div class="percentage" id="percentageDisplay">0.0000%</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button id="toggleModeBtn">הצג ברוטו (כולל סופ"שים)</button>
        <div class="mode-label" id="modeLabel">מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)</div>

        <div class="did-you-know" id="didYouKnow"></div>
    </div>

    <script>
        const startDate = new Date('2026-04-23T09:00:00').getTime();
        const endDate = new Date('2026-05-21T09:00:00').getTime();
        const totalCourseMs = endDate - startDate;

        const exclusions = [
            { start: new Date('2026-05-08T11:00:00').getTime(), end: new Date('2026-05-10T09:00:00').getTime() },
            { start: new Date('2026-05-15T11:00:00').getTime(), end: new Date('2026-05-17T09:00:00').getTime() }
        ];

        let isNetMode = true;

        function shootConfetti() {
            var duration = 3 * 1000;
            var animationEnd = Date.now() + duration;
            var defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 0 };

            function randomInRange(min, max) {
              return Math.random() * (max - min) + min;
            }

            var interval = setInterval(function() {
              var timeLeft = animationEnd - Date.now();

              if (timeLeft <= 0) {
                return clearInterval(interval);
              }

              var particleCount = 50 * (timeLeft / duration);
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        function updateProgress() {
            const now = new Date().getTime();
            
            let totalDuration = endDate - startDate;
            let elapsed = now - startDate;

            if (elapsed < 0) elapsed = 0;
            if (elapsed > totalDuration) elapsed = totalDuration;

            if (isNetMode) {
                let excludedTotal = 0;
                let excludedElapsed = 0;

                exclusions.forEach(ex => {
                    excludedTotal += (ex.end - ex.start);
                    if (now > ex.start) {
                        if (now > ex.end) {
                            excludedElapsed += (ex.end - ex.start);
                        } else {
                            excludedElapsed += (now - ex.start);
                        }
                    }
                });

                totalDuration -= excludedTotal;
                elapsed -= excludedElapsed;
            }

            let percentage = (elapsed / totalDuration) * 100;
            percentage = Math.max(0, Math.min(100, percentage));

            document.getElementById('percentageDisplay').innerText = percentage.toFixed(4) + '%';
            const pBar = document.getElementById('progressBar');
            pBar.style.width = percentage + '%';

            const milestoneMsg = document.getElementById('milestoneMsg');
            const container = document.getElementById('mainContainer');
            
            // חלון החגיגה: רק בין 25% ל-28%
            if (percentage >= 25 && percentage < 28) {
                pBar.style.backgroundColor = '#f1c40f'; 
                milestoneMsg.style.display = 'block';
                container.classList.add('celebration-glow');

                const hasCelebrated = localStorage.getItem('celebrated25Percent');
                
                if (!hasCelebrated) {
                    shootConfetti(); 
                    localStorage.setItem('celebrated25Percent', 'true'); 
                }
            } else {
                // חזרה לשגרה (מתחת ל-25 או מעל 28)
                pBar.style.backgroundColor = '#27ae60'; 
                milestoneMsg.style.display = 'none';
                container.classList.remove('celebration-glow');
                
                // איפוס הזיכרון רק אם חזרנו אחורה מתחת ל-25 (למשל במקרה של שינוי תאריכים)
                if (percentage < 25) {
                    localStorage.removeItem('celebrated25Percent'); 
                }
            }
        }

        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isNetMode = !isNetMode;
            const btn = document.getElementById('toggleModeBtn');
            const label = document.getElementById('modeLabel');
            
            if (isNetMode) {
                btn.innerText = 'הצג ברוטו (כולל סופ"שים)';
                label.innerText = 'מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)';
            } else {
                btn.innerText = 'הצג נטו (ללא סופ"שים)';
                label.innerText = 'מצב נוכחי: ברוטו (כולל הכל)';
            }
            updateProgress();
        });

        function calcPercentFromTotal(minutes) {
            const ms = minutes * 60 * 1000;
            return ((ms / totalCourseMs) * 100).toFixed(4) + '%';
        }

        function getRandomFact() {
            const facts = [
                `הידעת? הליכה לאולם הנגב (3 דקות) לוקחת כ-${calcPercentFromTotal(3)} מהקורס.`,
                `הידעת? הנחת תפילין בבוקר (5 דקות) לוקחת כ-${calcPercentFromTotal(5)} מהזמן הכולל של הקורס.`,
                `הידעת? המתנה בהקשב מחוץ לכיתה (10 דקות) שורפת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? חיפוש מי חסר בשלשות (7 דקות) מבזבז ${calcPercentFromTotal(7)} מזמן הקורס.`,
                `הידעת? הורדת התנסות לוקחת לך ${calcPercentFromTotal(20)} מזמן הקורס.`,
                `הידעת? עמידה בתור לחדר האוכל (15 דקות) לוקחת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? גילוח וצחצוח בוקר (4 דקות) לוקחים כ-${calcPercentFromTotal(4)} מזמן הקורס.`,
                `הידעת? שינה של 7 שעות הלילה לוקחת ${calcPercentFromTotal(7 * 60)} מכל הקורס.`,
                `הידעת? ישיבה של 15 דקות בשירותים שורפת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? ריצת 3 ק"מ ב-15:30 דקות לוקחת ${calcPercentFromTotal(15.5)} מזמן הקורס.`,
                `הידעת? לקח לי 1.5% מהקורס להכין את האתר הזה!`
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        const didYouKnowEl = document.getElementById('didYouKnow');
        
        function changeFact() {
            didYouKnowEl.style.opacity = 0; 
            setTimeout(() => {
                didYouKnowEl.innerText = getRandomFact();
                didYouKnowEl.style.opacity = 1; 
            }, 500);
        }

        setInterval(updateProgress, 50);
        updateProgress();
        
        changeFact(); 
        setInterval(changeFact, 12000); 
    </script>
</body>
</html>

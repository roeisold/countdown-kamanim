<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונה התקדמות קורס</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #2c3e50;
        }
        .percentage {
            font-size: 48px;
            font-weight: bold;
            color: #27ae60;
            margin: 20px 0;
            font-variant-numeric: tabular-nums;
        }
        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.1s linear;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        .mode-label {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .did-you-know {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 4px solid #3498db;
            border-radius: 5px;
            font-size: 15px;
            color: #2c3e50;
            text-align: right;
            min-height: 45px;
            display: flex;
            align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>התקדמות הקורס</h1>
        <div class="percentage" id="percentageDisplay">0.0000%</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button id="toggleModeBtn">הצג ברוטו (כולל סופ"שים)</button>
        <div class="mode-label" id="modeLabel">מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)</div>

        <div class="did-you-know" id="didYouKnow"></div>
    </div>

    <script>
        // תאריכי התחלה וסיום
        const startDate = new Date('2026-04-23T09:00:00').getTime();
        const endDate = new Date('2026-05-21T09:00:00').getTime();
        const totalCourseMs = endDate - startDate; // סך הזמן הכולל במילישניות

        // הגדרת זמני ההחרגה (סופי שבוע)
        const exclusions = [
            { start: new Date('2026-05-08T00:00:00').getTime(), end: new Date('2026-05-09T23:59:59').getTime() },
            { start: new Date('2026-05-15T00:00:00').getTime(), end: new Date('2026-05-16T23:59:59').getTime() }
        ];

        let isNetMode = true;

        function updateProgress() {
            const now = new Date().getTime();
            
            let totalDuration = endDate - startDate;
            let elapsed = now - startDate;

            // טיפול במקרי קצה (לפני ההתחלה או אחרי הסיום)
            if (elapsed < 0) elapsed = 0;
            if (elapsed > totalDuration) elapsed = totalDuration;

            if (isNetMode) {
                let excludedTotal = 0;
                let excludedElapsed = 0;

                exclusions.forEach(ex => {
                    excludedTotal += (ex.end - ex.start);
                    if (now > ex.start) {
                        if (now > ex.end) {
                            excludedElapsed += (ex.end - ex.start);
                        } else {
                            excludedElapsed += (now - ex.start);
                        }
                    }
                });

                totalDuration -= excludedTotal;
                elapsed -= excludedElapsed;
            }

            let percentage = (elapsed / totalDuration) * 100;
            percentage = Math.max(0, Math.min(100, percentage));

            document.getElementById('percentageDisplay').innerText = percentage.toFixed(4) + '%';
            document.getElementById('progressBar').style.width = percentage + '%';
        }

        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isNetMode = !isNetMode;
            const btn = document.getElementById('toggleModeBtn');
            const label = document.getElementById('modeLabel');
            
            if (isNetMode) {
                btn.innerText = 'הצג ברוטו (כולל סופ"שים)';
                label.innerText = 'מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)';
            } else {
                btn.innerText = 'הצג נטו (ללא סופ"שים)';
                label.innerText = 'מצב נוכחי: ברוטו (כולל הכל)';
            }
            updateProgress();
        });

        // חישוב אחוז מהזמן הכולל לפי כמות דקות
        function calcPercentFromTotal(minutes) {
            const ms = minutes * 60 * 1000;
            return ((ms / totalCourseMs) * 100).toFixed(4) + '%';
        }

        function getRandomFact() {
            const facts = [
                `הידעת? הנחת תפילין בבוקר (5 דקות) לוקחת כ-${calcPercentFromTotal(5)} מהזמן הכולל של הקורס.`,
                `הידעת? הורדת התנסות לוקחת לך ${calcPercentFromTotal(20)} מכל ההתנסות.`,
                `הידעת? שינה של 7 שעות הלילה לוקחת ${calcPercentFromTotal(7 * 60)} מכל הקורס.`,
                `הידעת? ישיבה של 15 דקות בשירותים שורפת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? צחצוח שיניים (בערך 3 דקות) לוקח כ-${calcPercentFromTotal(3)} מזמן הקורס.`,
                `הידעת? לקח לי 1.5% מהקורס להכין את האתר הזה!`,
                `הידעת? ריצת 3 ק"מ ב-15:15 דקות לוקחת ${calcPercentFromTotal(15.25)} מזמן הקורס.`,
                `הידעת? חליטת 36 גרם אספרסו ב-30 שניות שורפת בדיוק ${calcPercentFromTotal(0.5)} מהקורס.`
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        const didYouKnowEl = document.getElementById('didYouKnow');
        
        function changeFact() {
            didYouKnowEl.style.opacity = 0; // העלמה חלקה
            setTimeout(() => {
                didYouKnowEl.innerText = getRandomFact();
                didYouKnowEl.style.opacity = 1; // חזרה חלקה
            }, 500);
        }

        // הפעלות ראשוניות וטיימרים
        setInterval(updateProgress, 50);
        updateProgress();
        
        changeFact(); // עובדה ראשונה מיד בטעינה
        setInterval(changeFact, 12000); // החלפת עובדה כל 12 שניות
    </script>
</body>
</html>

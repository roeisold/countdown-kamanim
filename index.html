<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונה התקדמות קורס</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden; 
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            /* מעבר חלק לאפקטים החגיגיים */
            transition: box-shadow 0.6s ease-out, border 0.6s ease-out; 
            border: 2px solid transparent; /* הכנה לגבול מוזהב */
        }

        /* אפקט הילה גדול ובולט לקונטיינר ב-25% */
        .celebration-glow {
            /* שתי שכבות של צל מוזהב למראה עשיר ובולט */
            box-shadow: 0 0 60px rgba(241, 196, 15, 0.8), 0 0 100px rgba(241, 196, 15, 0.4);
            border: 3px solid #f1c40f;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #2c3e50;
        }
        .milestone-msg {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 10px;
            display: none; 
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-3px);}
        }
        .percentage {
            font-size: 48px;
            font-weight: bold;
            color: #27ae60; /* צבע ברירת מחדל ירוק */
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.6s ease, text-shadow 0.6s ease; /* מעבר חלק לצבע זהב */
        }

        /* סגנון חגיגי לפונט האחוזים בזהב */
        .celebration-percentage {
            color: #f1c40f; /* צבע זהב */
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.7); /* הילת טקסט מוזהבת */
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.1s linear, background-color 0.5s ease;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #2980b9;
        }
        .mode-label {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .did-you-know {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 4px solid #3498db;
            border-radius: 5px;
            font-size: 15px;
            color: #2c3e50;
            text-align: right;
            min-height: 45px;
            display: flex;
            align-items: center;
            transition: opacity 0.5s ease;
        }
    </style>
</head>
<body>

    <div class="container" id="mainContainer">
        <h1>התקדמות הקורס</h1>
        <div class="milestone-msg" id="milestoneMsg">🎉 25% מהדרך מאחורינו! 🎉</div>
        <div class="percentage" id="percentageDisplay">0.0000%</div>
        
        <div class="progress-bar-container">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button id="toggleModeBtn">הצג ברוטו (כולל סופ"שים)</button>
        <div class="mode-label" id="modeLabel">מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)</div>

        <div class="did-you-know" id="didYouKnow"></div>
    </div>

    <script>
        // תאריכי התחלה וסיום
        const startDate = new Date('2026-04-23T09:00:00').getTime();
        const endDate = new Date('2026-05-21T09:00:00').getTime();
        const totalCourseMs = endDate - startDate;

        // הגדרת זמני ההחרגה
        const exclusions = [
            { start: new Date('2026-05-08T11:00:00').getTime(), end: new Date('2026-05-10T09:00:00').getTime() },
            { start: new Date('2026-05-15T11:00:00').getTime(), end: new Date('2026-05-17T09:00:00').getTime() }
        ];

        let isNetMode = true;

        // פונקציית פיצוץ הקונפטי - משופרת לפיצוץ מסיבי
        function shootConfetti() {
            // הגדרות פיצוץ בסיסיות (כמות חלקיקים גדולה)
            const count = 300; 
            const defaults = {
              origin: { y: 0.7 }, // מתחיל קצת נמוך כדי שיראו את העלייה
              zIndex: 1000,
            };

            // פונקציה לירי של מטחים שונים
            function fire(particleRatio, opts) {
              confetti({
                ...defaults,
                ...opts,
                particleCount: Math.floor(count * particleRatio),
              });
            }

            // סדרה של פיצוצים קטנים עוקבים ליצירת מראה עשיר
            fire(0.25, {
              spread: 26,
              startVelocity: 55,
            });
            fire(0.2, {
              spread: 60,
            });
            fire(0.35, {
              spread: 100,
              decay: 0.91,
              scalar: 0.8
            });
            fire(0.1, {
              spread: 120,
              startVelocity: 25,
              decay: 0.92,
              scalar: 1.2
            });
            fire(0.1, {
              spread: 120,
              startVelocity: 45,
            });
        }

        function updateProgress() {
            const now = new Date().getTime();
            let totalDuration = endDate - startDate;
            let elapsed = now - startDate;

            if (elapsed < 0) elapsed = 0;
            if (elapsed > totalDuration) elapsed = totalDuration;

            // חישוב נטו
            let excludedTotal = 0;
            let excludedElapsed = 0;
            exclusions.forEach(ex => {
                excludedTotal += (ex.end - ex.start);
                if (now > ex.start) {
                    if (now > ex.end) excludedElapsed += (ex.end - ex.start);
                    else excludedElapsed += (now - ex.start);
                }
            });

            const netTotal = totalDuration - excludedTotal;
            const netElapsed = elapsed - excludedElapsed;
            const netPercentage = Math.max(0, Math.min(100, (netElapsed / netTotal) * 100));
            const grossPercentage = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));

            // מה מוצג כרגע?
            const displayPercentage = isNetMode ? netPercentage : grossPercentage;

            document.getElementById('percentageDisplay').innerText = displayPercentage.toFixed(4) + '%';
            const pBar = document.getElementById('progressBar');
            pBar.style.width = displayPercentage + '%';

            // לוגיקת החגיגה - לפי מה שמוצג על המסך
            const milestoneMsg = document.getElementById('milestoneMsg');
            const container = document.getElementById('mainContainer');
            const percentageDisplay = document.getElementById('percentageDisplay');
            
            // טווח החגיגה: בין 25% ל-28%
            if (displayPercentage >= 25 && displayPercentage < 28) {
                pBar.style.backgroundColor = '#f1c40f'; // בר מוזהב
                milestoneMsg.style.display = 'block';
                container.classList.add('celebration-glow'); // הילה גדולה לקונטיינר
                percentageDisplay.classList.add('celebration-percentage'); // פונט אחוזים בזהב

                // מפתח זיכרון נפרד לכל מצב כדי שכל אחד יקבל פיצוץ בפעם הראשונה שלו
                const storageKey = isNetMode ? 'celebrated25Net' : 'celebrated25Gross';
                if (!localStorage.getItem(storageKey)) {
                    shootConfetti(); // הפיצוץ המסיבי
                    localStorage.setItem(storageKey, 'true'); // שומר שלא יתפוצץ שוב
                }
            } else {
                // חזרה למראה הרגיל (מחוץ לטווח ה-25%-28%)
                pBar.style.backgroundColor = '#27ae60'; 
                milestoneMsg.style.display = 'none';
                container.classList.remove('celebration-glow');
                percentageDisplay.classList.remove('celebration-percentage');
                
                // איפוס הזיכרון רק אם יורדים חזרה מתחת ל-25%
                if (displayPercentage < 25) {
                    localStorage.removeItem(isNetMode ? 'celebrated25Net' : 'celebrated25Gross'); 
                }
            }
        }

        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isNetMode = !isNetMode;
            const btn = document.getElementById('toggleModeBtn');
            const label = document.getElementById('modeLabel');
            if (isNetMode) {
                btn.innerText = 'הצג ברוטו (כולל סופ"שים)';
                label.innerText = 'מצב נוכחי: נטו (ללא 8-9.5 ו-15-16.5)';
            } else {
                btn.innerText = 'הצג נטו (ללא סופ"שים)';
                label.innerText = 'מצב נוכחי: ברוטו (כולל הכל)';
            }
            updateProgress();
        });

        function calcPercentFromTotal(minutes) {
            const ms = minutes * 60 * 1000;
            return ((ms / totalCourseMs) * 100).toFixed(4) + '%';
        }

        function getRandomFact() {
            const facts = [
                `הידעת? הליכה לאולם הנגב (3 דקות) לוקחת כ-${calcPercentFromTotal(3)} מהקורס.`,
                `הידעת? הנחת תפילין בבוקר (5 דקות) לוקחת כ-${calcPercentFromTotal(5)} מהקורס.`,
                `הידעת? הורדת התנסות לוקחת לך ${calcPercentFromTotal(20)} מזמן הקורס.`,
                `הידעת? עמידה בתור לחדר האוכל (15 דקות) לוקחת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? גילוח וצחצוח בוקר (4 דקות) לוקחים כ-${calcPercentFromTotal(4)} מהקורס.`,
                `הידעת? שינה של 7 שעות הלילה לוקחת ${calcPercentFromTotal(7 * 60)} מכל הקורס.`,
                `הידעת? ישיבה של 15 דקות בשירותים שורפת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? ריצת 3 ק"מ ב-15:30 דקות לוקחת ${calcPercentFromTotal(15.5)} מזמן הקורס.`,
                `הידעת? כתיבת 3 יעדים ביומן (10 דקות) שווה ערך ל-${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? גלילה ממוצעת ב-Reels (20 דקות) שורפת ${calcPercentFromTotal(20)} מהקורס.`,
                `הידעת? בזמן שקראת את הידיעה הזאת (10 שניות), עבר בדיוק ${calcPercentFromTotal(10 / 60)} מהקורס.`,
                `הידעת? יום ג' רפואי (24 שעות בבית) שווה ל-${calcPercentFromTotal(24 * 60)} מהקורס.`,
                `הידעת? גזירת זמנים של 10 דקות לוקחת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? הליכה מהתעלה לש"ג (10 דקות) לוקחת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? תרגיל מרחב מוגן (15 דקות) לוקח ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? זמן תור בחלבייה בבוקר (10 דקות) שורף ${calcPercentFromTotal(10)} מהקורס.`
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        const didYouKnowEl = document.getElementById('didYouKnow');
        function changeFact() {
            didYouKnowEl.style.opacity = 0; 
            setTimeout(() => {
                didYouKnowEl.innerText = getRandomFact();
                didYouKnowEl.style.opacity = 1; 
            }, 500);
        }

        // הפעלות ראשוניות וטיימרים
        setInterval(updateProgress, 50);
        updateProgress();
        changeFact(); 
        setInterval(changeFact, 12000); 
    </script>
</body>
</html>

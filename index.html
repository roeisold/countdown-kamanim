<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מונה התקדמות קורס</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
            overflow: hidden; 
            transition: background-color 0.5s ease;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 90%;
            position: relative;
            transition: box-shadow 0.6s ease-out, border 0.6s ease-out; 
            border: 2px solid transparent; 
            z-index: 1;
        }

        .celebration-glow {
            box-shadow: 0 0 60px rgba(241, 196, 15, 0.8), 0 0 100px rgba(241, 196, 15, 0.4);
            border: 3px solid #f1c40f;
        }
        
        .celebration-glow-50 {
            box-shadow: 0 0 60px rgba(52, 152, 219, 0.8), 0 0 100px rgba(52, 152, 219, 0.4);
            border: 3px solid #3498db;
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
            color: #2c3e50;
            transition: color 0.5s ease;
        }
        .milestone-msg {
            font-size: 18px;
            font-weight: bold;
            color: #d35400;
            margin-bottom: 10px;
            display: none; 
            animation: bounce 2s infinite;
        }
        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-5px);}
            60% {transform: translateY(-3px);}
        }
        .percentage {
            font-size: 48px;
            font-weight: bold;
            color: #27ae60; 
            margin: 10px 0 20px 0;
            font-variant-numeric: tabular-nums;
            transition: color 0.6s ease, text-shadow 0.6s ease; 
        }

        .celebration-percentage {
            color: #f1c40f; 
            text-shadow: 0 0 15px rgba(241, 196, 15, 0.7); 
        }

        .progress-bar-container {
            width: 100%;
            background-color: #e0e0e0;
            border-radius: 25px;
            overflow: hidden;
            height: 30px;
            margin-bottom: 30px;
        }
        .progress-bar {
            height: 100%;
            background-color: #27ae60;
            width: 0%;
            transition: width 0.1s linear, background-color 0.5s ease;
        }
        button.action-btn {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button.action-btn:hover {
            background-color: #2980b9;
        }
        .mode-label {
            margin-top: 15px;
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }
        .did-you-know {
            margin-top: 20px;
            padding: 15px;
            background-color: #e8f4f8;
            border-right: 4px solid #3498db;
            border-radius: 5px;
            font-size: 15px;
            color: #2c3e50;
            text-align: right;
            min-height: 45px;
            display: flex;
            align-items: center;
            transition: opacity 0.5s ease;
        }

        /* כפתור חגיגת 50 אחוז */
        .celebrate-50-btn {
            display: none;
            background: linear-gradient(45deg, #e74c3c, #f1c40f);
            color: white;
            border: none;
            padding: 20px 30px;
            font-size: 24px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin: 20px 0;
            animation: pulse-btn 1s infinite alternate;
            box-shadow: 0 10px 25px rgba(231, 76, 60, 0.5);
            width: 100%;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }
        
        /* כפתור חגיגת אירוויזיון */
        .eurovision-btn {
            background: linear-gradient(45deg, #0038b8, #00bfff);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(0, 56, 184, 0.4);
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
            display: none; /* מוסתר כברירת מחדל, נדליק אותו ב-JS אם התאריך רלוונטי */
        }
        .eurovision-btn:hover {
            transform: scale(1.02);
            box-shadow: 0 8px 20px rgba(0, 56, 184, 0.6);
        }

        @keyframes pulse-btn {
            0% { transform: scale(1); box-shadow: 0 5px 15px rgba(231, 76, 60, 0.4); }
            100% { transform: scale(1.05); box-shadow: 0 15px 30px rgba(241, 196, 15, 0.6); }
        }

        /* סגנונות RAINBOW גלובליים לחגיגת 50% */
        @keyframes rainbow-anim {
            0% { background-position: 0% center; }
            100% { background-position: 200% center; }
        }

        .rainbow-active h1,
        .rainbow-active .percentage,
        .rainbow-active .milestone-msg,
        .rainbow-active .mode-label,
        .rainbow-active .did-you-know {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3);
            background-size: 200% auto;
            color: transparent !important;
            -webkit-background-clip: text !important;
            background-clip: text !important;
            animation: rainbow-anim 2s linear infinite !important;
        }

        .rainbow-active button.action-btn {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3) !important;
            background-size: 200% auto;
            color: white !important;
            animation: rainbow-anim 2s linear infinite !important;
            border: none;
            text-shadow: 0 0 5px rgba(0,0,0,0.5);
        }

        .rainbow-active .progress-bar {
            background: linear-gradient(to right, #ff0000, #ff7f00, #ffff00, #00ff00, #0000ff, #4b0082, #9400d3) !important;
            background-size: 200% auto;
            animation: rainbow-anim 2s linear infinite !important;
        }

        /* סגנונות לשכבות אוברליי */
        .meme-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 9999;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }
        .meme-container {
            position: relative;
            max-width: 90%;
            width: 600px;
            text-align: center;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .meme-container img {
            width: 100%;
            border-radius: 10px;
            box-shadow: 0 0 40px rgba(255, 255, 255, 0.2);
            display: block;
        }
        
        .meme-text {
            position: absolute;
            top: 5%; 
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 4.5rem;
            color: white; 
            -webkit-text-stroke: 3px black; 
            text-shadow: 4px 4px 0px #000; 
            width: 95%;
            line-height: 1.1;
            text-transform: uppercase;
        }
        .meme-subtext {
            position: absolute;
            bottom: 5%; 
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Impact', sans-serif;
            font-size: 2.5rem;
            color: white;
            -webkit-text-stroke: 2px black;
            text-shadow: 3px 3px 0px #000;
            width: 95%;
            text-transform: uppercase;
        }

        /* סגנון טקסט ייעודי לאירוויזיון */
        .eurovision-text {
            position: static;
            transform: none;
            font-size: 4rem;
            color: #fff;
            -webkit-text-stroke: 2px #0038b8;
            text-shadow: 0 0 20px #0038b8, 3px 3px 0px #000;
            margin-bottom: 20px;
        }
        
        .close-meme-btn {
            margin-top: 30px;
            background-color: #e74c3c;
            color: white;
            border: none;
            font-size: 20px;
            font-weight: bold;
            padding: 15px 40px;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            z-index: 10000;
        }
        .close-meme-btn:hover {
            background-color: #c0392b;
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <audio id="halfwayAudio" src="halfway.mp3" preload="auto" loop></audio>
    <audio id="eurovisionAudio" src="eurovision.mp3" preload="auto" loop></audio>

    <div id="memeOverlay" class="meme-overlay">
        <div class="meme-container">
            <img src="wall.jpg" alt="Brick Wall">
            <div class="meme-text">נגענו בקיר!</div>
            <div class="meme-subtext">WOOOAH, WE'RE HALFWAY THERE!</div>
        </div>
        <button id="closeMemeBtn" class="close-meme-btn">יאללה להמשיך</button>
    </div>

    <div id="eurovisionOverlay" class="meme-overlay">
        <div class="meme-container">
            <div class="meme-text eurovision-text">מקום שני<br>באירוויזיון! 🇮🇱</div>
            <div class="meme-subtext eurovision-text" style="font-size: 3rem;">דוז פואה!</div>
        </div>
        <button id="closeEurovisionBtn" class="close-meme-btn" style="background-color: #0038b8;">חזרה לאתר</button>
    </div>

    <div class="container" id="mainContainer">
        <h1>התקדמות הקורס</h1>
        <div class="milestone-msg" id="milestoneMsg"></div>
        
        <button id="celebrate50Btn" class="celebrate-50-btn"></button>

        <div class="percentage" id="percentageDisplay">0.0000%</div>
        <div class="progress-bar-container" id="progressBarContainer">
            <div class="progress-bar" id="progressBar"></div>
        </div>

        <button id="toggleModeBtn" class="action-btn">הצג ברוטו (כולל סופ"שים)</button>
        <div class="mode-label" id="modeLabel">מצב נוכחי: נטו (ללא 1-2.5 ו-8-9.5)</div>

        <button id="eurovisionBtn" class="eurovision-btn">🎤 לחץ לחגיגות אירוויזיון! 🇮🇱</button>

        <div class="did-you-know" id="didYouKnow"></div>
    </div>

    <script>
        const startDate = new Date('2026-04-23T09:00:00').getTime();
        const endDate = new Date('2026-05-21T09:00:00').getTime();
        const totalCourseMs = endDate - startDate;

        // שעת פקיעת התוקף של כפתור האירוויזיון - 17.5.2026 בשעה 23:59:59
        const eurovisionCutoffDate = new Date('2026-05-17T23:59:59').getTime();

        const exclusions = [
            { start: new Date('2026-05-01T11:00:00').getTime(), end: new Date('2026-05-03T09:00:00').getTime() },
            { start: new Date('2026-05-08T11:00:00').getTime(), end: new Date('2026-05-10T09:00:00').getTime() }
        ];

        let isNetMode = true;

        function shootConfetti() {
            const count = 300; 
            const defaults = { origin: { y: 0.7 }, zIndex: 10000 }; 
            function fire(particleRatio, opts) {
              confetti({ ...defaults, ...opts, particleCount: Math.floor(count * particleRatio) });
            }
            fire(0.25, { spread: 26, startVelocity: 55 });
            fire(0.2, { spread: 60 });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45 });
        }

        function shootEurovisionConfetti() {
            const duration = 5 * 1000;
            const animationEnd = Date.now() + duration;
            const defaults = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 10000, colors: ['#ffffff', '#0038b8'] };

            function randomInRange(min, max) { return Math.random() * (max - min) + min; }

            const interval = setInterval(function() {
              const timeLeft = animationEnd - Date.now();
              if (timeLeft <= 0) return clearInterval(interval);
              
              const particleCount = 50 * (timeLeft / duration);
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.1, 0.3), y: Math.random() - 0.2 } });
              confetti({ ...defaults, particleCount, origin: { x: randomInRange(0.7, 0.9), y: Math.random() - 0.2 } });
            }, 250);
        }

        document.getElementById('celebrate50Btn').addEventListener('click', () => {
            const storageKey50 = isNetMode ? 'celebrated50Net' : 'celebrated50Gross';
            shootConfetti();
            document.getElementById('memeOverlay').style.display = 'flex'; 
            document.getElementById('halfwayAudio').play().catch(e => console.log('Audio error', e));
            localStorage.setItem(storageKey50, 'true'); 
            updateProgress();
        });

        document.getElementById('closeMemeBtn').addEventListener('click', () => {
            document.getElementById('memeOverlay').style.display = 'none';
            const audio = document.getElementById('halfwayAudio');
            audio.pause();
            audio.currentTime = 0; 
        });

        document.getElementById('eurovisionBtn').addEventListener('click', () => {
            shootEurovisionConfetti();
            document.getElementById('eurovisionOverlay').style.display = 'flex';
            document.getElementById('eurovisionAudio').play().catch(e => console.log('Eurovision Audio error', e));
        });

        document.getElementById('closeEurovisionBtn').addEventListener('click', () => {
            document.getElementById('eurovisionOverlay').style.display = 'none';
            const audio = document.getElementById('eurovisionAudio');
            audio.pause();
            audio.currentTime = 0;
        });

        function updateProgress() {
            const now = new Date().getTime(); 

            let totalDuration = endDate - startDate;
            let elapsed = now - startDate;

            if (elapsed < 0) elapsed = 0;
            if (elapsed > totalDuration) elapsed = totalDuration;

            let excludedTotal = 0;
            let excludedElapsed = 0;
            exclusions.forEach(ex => {
                excludedTotal += (ex.end - ex.start);
                if (now > ex.start) {
                    if (now > ex.end) excludedElapsed += (ex.end - ex.start);
                    else excludedElapsed += (now - ex.start);
                }
            });

            const netTotal = totalDuration - excludedTotal;
            const netElapsed = elapsed - excludedElapsed;
            const netPercentage = Math.max(0, Math.min(100, (netElapsed / netTotal) * 100));
            const grossPercentage = Math.max(0, Math.min(100, (elapsed / totalDuration) * 100));

            const displayPercentage = isNetMode ? netPercentage : grossPercentage;

            document.getElementById('percentageDisplay').innerText = displayPercentage.toFixed(4) + '%';
            const pBar = document.getElementById('progressBar');
            pBar.style.width = displayPercentage + '%';

            const milestoneMsg = document.getElementById('milestoneMsg');
            const container = document.getElementById('mainContainer');
            const percentageDisplay = document.getElementById('percentageDisplay');
            const progressBarContainer = document.getElementById('progressBarContainer');
            const toggleModeBtn = document.getElementById('toggleModeBtn');
            const modeLabel = document.getElementById('modeLabel');
            const didYouKnow = document.getElementById('didYouKnow');
            const celebrateBtn = document.getElementById('celebrate50Btn');
            const eurovisionBtn = document.getElementById('eurovisionBtn');
            
            // בדיקת התאריך עבור כפתור האירוויזיון
            const isEurovisionActive = now <= eurovisionCutoffDate;

            // טווח ה-50% עד 52%
            if (displayPercentage >= 50 && displayPercentage < 52) {
                const storageKey50 = isNetMode ? 'celebrated50Net' : 'celebrated50Gross';
                const hasCelebrated = localStorage.getItem(storageKey50);

                if (!hasCelebrated) {
                    percentageDisplay.style.display = 'none';
                    progressBarContainer.style.display = 'none';
                    toggleModeBtn.style.display = 'none';
                    modeLabel.style.display = 'none';
                    didYouKnow.style.display = 'none';
                    milestoneMsg.style.display = 'none';
                    eurovisionBtn.style.display = 'none'; // מוסתר בנעילת 50%

                    container.className = 'container celebration-glow-50';
                    document.body.classList.remove('rainbow-active'); 

                    celebrateBtn.style.display = 'block';
                    celebrateBtn.innerText = '🚨 הגענו ל-50%! לחץ לפתיחת האתר 🚨';
                } else {
                    percentageDisplay.style.display = 'block';
                    progressBarContainer.style.display = 'block';
                    toggleModeBtn.style.display = 'inline-block';
                    modeLabel.style.display = 'block';
                    didYouKnow.style.display = 'flex';
                    
                    if (isEurovisionActive) {
                        eurovisionBtn.style.display = 'block';
                    } else {
                        eurovisionBtn.style.display = 'none';
                    }
                    
                    milestoneMsg.innerText = '🔥 חצי קורס מאחורינו! נגענו בקיר! 🔥';
                    milestoneMsg.style.display = 'block';

                    pBar.style.backgroundColor = '#3498db'; 
                    container.className = 'container celebration-glow-50';
                    document.body.classList.add('rainbow-active'); 

                    celebrateBtn.style.display = 'block';
                    celebrateBtn.innerText = '🎁 הפעל שוב את חגיגת הקיר! 🎁';
                }
            }
            // חגיגת ה-25%
            else if (displayPercentage >= 25 && displayPercentage < 28) {
                restoreUI(isEurovisionActive);
                pBar.style.backgroundColor = '#f1c40f'; 
                milestoneMsg.innerText = '🎉 25% מהדרך מאחורינו! 🎉';
                milestoneMsg.style.display = 'block';
                
                container.className = 'container celebration-glow'; 
                percentageDisplay.className = 'percentage celebration-percentage'; 
                
                document.body.classList.remove('rainbow-active'); 
                celebrateBtn.style.display = 'none';

                const storageKey25 = isNetMode ? 'celebrated25Net' : 'celebrated25Gross';
                if (!localStorage.getItem(storageKey25)) {
                    shootConfetti(); 
                    localStorage.setItem(storageKey25, 'true'); 
                }
            } 
            // מצב שגרה
            else {
                restoreUI(isEurovisionActive);
                pBar.style.backgroundColor = '#27ae60'; 
                milestoneMsg.style.display = 'none';
                container.className = 'container';
                percentageDisplay.className = 'percentage';
                document.body.classList.remove('rainbow-active'); 
                celebrateBtn.style.display = 'none';
                
                if (displayPercentage < 50) localStorage.removeItem(isNetMode ? 'celebrated50Net' : 'celebrated50Gross'); 
                if (displayPercentage < 25) localStorage.removeItem(isNetMode ? 'celebrated25Net' : 'celebrated25Gross'); 
            }
        }

        function restoreUI(isEurovisionActive) {
            document.getElementById('percentageDisplay').style.display = 'block';
            document.getElementById('progressBarContainer').style.display = 'block';
            document.getElementById('toggleModeBtn').style.display = 'inline-block';
            document.getElementById('modeLabel').style.display = 'block';
            document.getElementById('didYouKnow').style.display = 'flex';
            
            if (isEurovisionActive) {
                document.getElementById('eurovisionBtn').style.display = 'block';
            } else {
                document.getElementById('eurovisionBtn').style.display = 'none';
            }
        }

        document.getElementById('toggleModeBtn').addEventListener('click', () => {
            isNetMode = !isNetMode;
            const btn = document.getElementById('toggleModeBtn');
            const label = document.getElementById('modeLabel');
            if (isNetMode) {
                btn.innerText = 'הצג ברוטו (כולל סופ"שים)';
                label.innerText = 'מצב נוכחי: נטו (ללא 1-2.5 ו-8-9.5)';
            } else {
                btn.innerText = 'הצג נטו (ללא סופ"שים)';
                label.innerText = 'מצב נוכחי: ברוטו (כולל הכל)';
            }
            updateProgress();
        });

        function calcPercentFromTotal(minutes) {
            const ms = minutes * 60 * 1000;
            return ((ms / totalCourseMs) * 100).toFixed(4) + '%';
        }

        function getRandomFact() {
            const facts = [
                `הידעת? הליכה לאולם הנגב (3 דקות) לוקחת כ-${calcPercentFromTotal(3)} מהקורס.`,
                `הידעת? הנחת תפילין בבוקר (5 דקות) לוקחת כ-${calcPercentFromTotal(5)} מהקורס.`,
                `הידעת? הורדת התנסות לוקחת לך ${calcPercentFromTotal(20)} מזמן הקורס.`,
                `הידעת? עמידה בתור לחדר האוכל (15 דקות) לוקחת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? גילוח וצחצוח בוקר (4 דקות) לוקחים כ-${calcPercentFromTotal(4)} מהקורס.`,
                `הידעת? שינה של 7 שעות הלילה לוקחת ${calcPercentFromTotal(7 * 60)} מכל הקורס.`,
                `הידעת? ישיבה של 15 דקות בשירותים שורפת ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? ריצת 3 ק"מ ב-15:30 דקות לוקחת ${calcPercentFromTotal(15.5)} מזמן הקורס.`,
                `הידעת? כתיבת 3 יעדים ביומן (10 דקות) שווה ערך ל-${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? גלילה ממוצעת ב-Reels (20 דקות) שורפת ${calcPercentFromTotal(20)} מהקורס.`,
                `הידעת? בזמן שקראת את הידיעה הזאת (10 שניות), עבר בדיוק ${calcPercentFromTotal(10 / 60)} מהקורס.`,
                `הידעת? יום ג' רפואי (24 שעות בבית) שווה ל-${calcPercentFromTotal(24 * 60)} מהקורס.`,
                `הידעת? גזירת זמנים של 10 דקות לוקחת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? הליכה מהתעלה לש"ג (10 דקות) לוקחת ${calcPercentFromTotal(10)} מהקורס.`,
                `הידעת? תרגיל מרחב מוגן (15 דקות) לוקח ${calcPercentFromTotal(15)} מהקורס.`,
                `הידעת? זמן תור בחלבייה בבוקר (10 דקות) שורף ${calcPercentFromTotal(10)} מהקורס.`
            ];
            return facts[Math.floor(Math.random() * facts.length)];
        }

        const didYouKnowEl = document.getElementById('didYouKnow');
        function changeFact() {
            if(didYouKnowEl.style.display !== 'none') {
                didYouKnowEl.style.opacity = 0; 
                setTimeout(() => {
                    didYouKnowEl.innerText = getRandomFact();
                    didYouKnowEl.style.opacity = 1; 
                }, 500);
            }
        }

        setInterval(updateProgress, 50);
        updateProgress();
        changeFact(); 
        setInterval(changeFact, 12000); 
    </script>
</body>
</html>
